services:
  # One single Web Service — backend serves the built frontend
  - type: web
    name: floony-ai
    runtime: node
    buildCommand: npm install --prefix backend && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false       # Paste your Supabase URL in Render dashboard
      - key: JWT_SECRET
        sync: false       # Paste your JWT secret in Render dashboard
      - key: GEMINI_API_KEY
        sync: false       # Paste your Gemini API key in Render dashboard
